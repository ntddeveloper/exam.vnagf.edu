<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Thi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .box { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: #1976d2; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background: #1976d2; color: white; padding: 12px; width: 100%; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; }
        .toggle { text-align: center; margin-top: 15px; font-size: 14px; color: #1976d2; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- KHU VỰC GỬI DỮ LIỆU ĐƯỢC BẢO MẬT BẰNG FORM NATIVE -->
    <div class="box">
        <h2 id="title">ĐĂNG KÝ HỆ THỐNG</h2>
        
        <!-- Sử dụng Form HTML truyền thống gửi thẳng dữ liệu qua Apps Script mà không bị trình duyệt chặn CORS -->
        <form action="https://google.com" method="POST" target="hidden_iframe" onsubmit="XửLýGửi()">
            
            <!-- Trường ẩn bắt buộc để định vị hành động trên Google Server -->
            <input type="hidden" name="action" value="register">

            <div class="form-group">
                <label>Họ và Tên</label>
                <input type="text" name="fullName" required placeholder="Nguyễn Văn A">
            </div>
            
            <div class="form-group">
                <label>Email Cá Nhân</label>
                <input type="email" name="email" required placeholder="example@gmail.com">
            </div>
            
            <div class="form-group">
                <label>Vai Trò Thành Viên</label>
                <select name="role">
                    <option value="student">Thí sinh dự thi</option>
                    <option value="teacher">Giảng viên chấm bài</option>
                </select>
            </div>
            
            <button type="submit" class="btn" id="btn-submit">GỬI YÊU CẦU ĐĂNG KÝ</button>
        </form>
    </div>

    <!-- Ô chặn ẩn danh giúp trang web không bị tải lại hoặc chuyển hướng khi bấm nút gửi -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitted) HoànThành();"></iframe>

<script>
    let isSubmitted = false;

    function XửLýGửi() {
        isSubmitted = true;
        document.getElementById("btn-submit").innerText = "Đang gửi dữ liệu...";
        document.getElementById("btn-submit").disabled = true;
    }

    function HoànThành() {
        alert("Đơn đăng ký của bạn đã được ghi nhận trên hệ thống máy chủ!\nHãy kiểm tra hòm thư Gmail để phê duyệt tài khoản.");
        document.getElementById("btn-submit").innerText = "GỬI YÊU CẦU ĐĂNG KÝ";
        document.getElementById("btn-submit").disabled = false;
        isSubmitted = false;
    }
</script>
</body>
</html>
