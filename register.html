<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Hệ Thống</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .auth-box { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .auth-box h2 { text-align: center; margin-bottom: 20px; color: #1976d2; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background: #1976d2; color: white; padding: 12px; width: 100%; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #1565c0; }
        .link-toggle { text-align: center; margin-top: 15px; font-size: 14px; }
        .link-toggle a { color: #1976d2; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-box">
        <h2>ĐĂNG KÝ HỆ THỐNG</h2>
        <div class="form-group">
            <label>Họ và Tên</label>
            <input type="text" id="auth-name" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="auth-email" placeholder="example@gmail.com">
        </div>
        <div class="form-group">
            <label>Bạn là:</label>
            <select id="auth-role">
                <option value="student">Thí sinh dự thi</option>
                <option value="teacher">Giảng viên chấm bài</option>
            </select>
        </div>
        <button class="btn" id="btn-register" onclick="submitRegister()">GỬI YÊU CẦU ĐĂNG KÝ</button>
        <div class="link-toggle"><a href="index.html">Đã có tài khoản? Đăng nhập ngay</a></div>
    </div>

<script>
    // Link API Apps Script chính xác của bạn đã được điền sẵn ở đây
    const API_URL = 'https://google.com';
    
    async function submitRegister() {
        const email = document.getElementById("auth-email").value.trim();
        const name = document.getElementById("auth-name").value.trim();
        const role = document.getElementById("auth-role").value;

        if (!email || !name) { 
            alert("Vui lòng nhập đầy đủ cả Họ tên và Email!"); 
            return; 
        }

        document.getElementById("btn-register").innerText = "Vui lòng đợi...";
        document.getElementById("btn-register").disabled = true;

        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "register", email: email, fullName: name, role: role })
            });
            alert("Yêu cầu đăng ký đã gửi thành công!\nVui lòng chờ Chủ quản duyệt qua Gmail để nhận mật khẩu.");
            window.location.href = "index.html"; // Tự động chuyển về trang đăng nhập
        } catch (err) {
            alert("Lỗi kết nối máy chủ!");
            document.getElementById("btn-register").innerText = "GỬI YÊU CẦU ĐĂNG KÝ";
            document.getElementById("btn-register").disabled = false;
        }
    }
</script>
</body>
</html>
